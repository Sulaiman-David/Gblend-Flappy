<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gblend Flappy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Press Start 2P', cursive;
            background-color: #0f0e17;
            color: #fffffe;
        }
        
        #gameCanvas {
            display: block;
            background: linear-gradient(to bottom, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        }
        
        .neon-text {
            text-shadow: 0 0 5px #ff2a6d, 0 0 10px #d16ba5, 0 0 15px #05d9e8;
        }
        
        .neon-border {
            box-shadow: 0 0 10px #05d9e8, 0 0 20px #05d9e8, inset 0 0 10px #05d9e8;
            border: 2px solid #05d9e8;
        }
        
        .glow {
            animation: glow 1.5s ease-in-out infinite alternate;
        }
        
        @keyframes glow {
            from {
                text-shadow: 0 0 5px #fff, 0 0 10px #ff2a6d, 0 0 15px #ff2a6d;
            }
            to {
                text-shadow: 0 0 10px #fff, 0 0 20px #ff2a6d, 0 0 30px #ff2a6d;
            }
        }
        
        .cyberpunk-btn {
            background: linear-gradient(45deg, #ff2a6d, #d16ba5);
            color: white;
            border: none;
            padding: 12px 24px;
            font-family: 'Press Start 2P', cursive;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        
        .cyberpunk-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 42, 109, 0.4);
        }
        
        .cyberpunk-btn:active {
            transform: translateY(0);
        }
        
        .cyberpunk-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }
        
        .cyberpunk-btn:hover::before {
            left: 100%;
        }
        
        .pipe {
            background: linear-gradient(to right, #05d9e8, #005678);
            border-left: 3px solid #ff2a6d;
            border-right: 3px solid #ff2a6d;
        }
        
        .gblend-label {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 24px;
            color: #05d9e8;
            text-shadow: 0 0 10px #05d9e8;
            opacity: 0.7;
            pointer-events: none;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-900">
    <div class="relative">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        
        <!-- gblend label -->
        <div class="gblend-label">gblend</div>
        
        <!-- Start Screen -->
        <div id="startScreen" class="absolute inset-0 flex flex-col items-center justify-center bg-black bg-opacity-70">
            <h1 class="text-4xl mb-6 neon-text glow">GBLEND FLAPPY</h1>
            <p class="mb-8 text-center px-4">Fluent Edition</p>
            <button id="startBtn" class="cyberpunk-btn neon-border">START GAME</button>
            <div class="mt-8 text-xs text-center">
                <p>Controls: Tap/Click to jump</p>
                <p class="mt-2 text-cyan-300">Let the Gblending begin!</p>
            </div>
        </div>
        
        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="absolute inset-0 flex flex-col items-center justify-center bg-black bg-opacity-80 hidden">
            <h2 class="text-3xl mb-4 neon-text">GAME OVER</h2>
            <p id="finalScore" class="text-2xl mb-6">Score: 0</p>
            <button id="restartBtn" class="cyberpunk-btn neon-border mb-4">PLAY AGAIN</button>
            <p class="text-xs mt-2 text-purple-300">"The city never sleeps... neither should you."</p>
        </div>
        
        <!-- Score Display -->
        <div id="scoreDisplay" class="absolute top-4 left-0 right-0 text-center text-2xl hidden neon-text">0</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const startScreen = document.getElementById('startScreen');
            const gameOverScreen = document.getElementById('gameOverScreen');
            const startBtn = document.getElementById('startBtn');
            const restartBtn = document.getElementById('restartBtn');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const finalScore = document.getElementById('finalScore');
            
            // Game variables with easier settings
            let bird = {
                x: 100,
                y: canvas.height / 2,
                width: 40,
                height: 30,
                velocity: 0,
                gravity: 0.3,  // Reduced gravity for slower falling
                jumpForce: -6,  // Reduced jump height
                color: '#ff2a6d'
            };
            
            let pipes = [];
            let score = 0;
            let gameSpeed = 2;  // Reduced horizontal speed
            let pipeGap = 180;  // Increased gap between pipes
            let pipeDistance = 200;  // Reduced distance between pipes
            let gameRunning = false;
            let difficultyTimer = 0;
            let difficultyInterval = 30000; // 30 seconds before difficulty increases
            
            // Cyberpunk city background elements
            let buildings = [];
            for (let i = 0; i < 10; i++) {
                buildings.push({
                    x: i * 150,
                    height: 100 + Math.random() * 200,
                    width: 100 + Math.random() * 100,
                    color: `hsl(${200 + Math.random() * 100}, 80%, 30%)`,
                    windows: []
                });
                
                // Add windows to buildings
                for (let j = 0; j < 5; j++) {
                    buildings[i].windows.push({
                        x: Math.random() * buildings[i].width,
                        y: Math.random() * buildings[i].height,
                        size: 5 + Math.random() * 10,
                        lit: Math.random() > 0.3
                    });
                }
            }
            
            // Stars for background
            let stars = [];
            for (let i = 0; i < 100; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2,
                    opacity: Math.random()
                });
            }
            
            // Event listeners
            startBtn.addEventListener('click', startGame);
            restartBtn.addEventListener('click', startGame);
            canvas.addEventListener('click', () => {
                if (gameRunning) {
                    bird.velocity = bird.jumpForce;
                }
            });
            
            // Start game function
            function startGame() {
                bird.y = canvas.height / 2;
                bird.velocity = 0;
                pipes = [];
                score = 0;
                gameSpeed = 2;
                pipeGap = 180;
                difficultyTimer = 0;
                
                startScreen.classList.add('hidden');
                gameOverScreen.classList.add('hidden');
                scoreDisplay.classList.remove('hidden');
                scoreDisplay.textContent = '0';
                
                gameRunning = true;
                requestAnimationFrame(gameLoop);
            }
            
            // Game over function
            function gameOver() {
                gameRunning = false;
                finalScore.textContent = `Score: ${score}`;
                gameOverScreen.classList.remove('hidden');
                scoreDisplay.classList.add('hidden');
            }
            
            // Create new pipe
            function createPipe() {
                const minHeight = 50;
                const maxHeight = canvas.height - pipeGap - minHeight;
                const height = minHeight + Math.random() * maxHeight;
                
                pipes.push({
                    x: canvas.width,
                    y: 0,
                    width: 60,
                    height: height,
                    passed: false
                });
                
                pipes.push({
                    x: canvas.width,
                    y: height + pipeGap,
                    width: 60,
                    height: canvas.height - height - pipeGap,
                    passed: false
                });
            }
            
            // Update game state
            function update() {
                // Update bird
                bird.velocity += bird.gravity;
                bird.y += bird.velocity;
                
                // Check if bird hits the ground or ceiling
                if (bird.y + bird.height > canvas.height || bird.y < 0) {
                    gameOver();
                }
                
                // Generate new pipes
                if (pipes.length === 0 || pipes[pipes.length - 1].x < canvas.width - pipeDistance) {
                    createPipe();
                }
                
                // Update pipes
                for (let i = 0; i < pipes.length; i++) {
                    pipes[i].x -= gameSpeed;
                    
                    // Check collision with bird
                    if (
                        bird.x + bird.width > pipes[i].x &&
                        bird.x < pipes[i].x + pipes[i].width &&
                        bird.y + bird.height > pipes[i].y &&
                        bird.y < pipes[i].y + pipes[i].height
                    ) {
                        gameOver();
                    }
                    
                    // Check if bird passed a pipe
                    if (!pipes[i].passed && bird.x > pipes[i].x + pipes[i].width) {
                        pipes[i].passed = true;
                        if (i % 2 === 0) { // Only count once per pipe pair
                            score++;
                            scoreDisplay.textContent = score;
                        }
                    }
                }
                
                // Remove pipes that are off screen
                pipes = pipes.filter(pipe => pipe.x + pipe.width > 0);
                
                // Increase difficulty over time
                difficultyTimer += 16; // Assuming 60fps
                if (difficultyTimer >= difficultyInterval) {
                    gameSpeed += 0.5;
                    pipeGap = Math.max(120, pipeGap - 10);
                    difficultyTimer = 0;
                }
            }
            
            // Draw game elements
            function draw() {
                // Clear canvas
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Draw night sky gradient
                const skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                skyGradient.addColorStop(0, '#0f0e17');
                skyGradient.addColorStop(1, '#16213e');
                ctx.fillStyle = skyGradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Draw stars
                ctx.fillStyle = 'white';
                stars.forEach(star => {
                    ctx.globalAlpha = star.opacity;
                    ctx.fillRect(star.x, star.y, star.size, star.size);
                });
                ctx.globalAlpha = 1;
                
                // Draw buildings
                buildings.forEach(building => {
                    // Draw building
                    ctx.fillStyle = building.color;
                    ctx.fillRect(building.x, canvas.height - building.height, building.width, building.height);
                    
                    // Draw windows
                    building.windows.forEach(window => {
                        ctx.fillStyle = window.lit ? '#ffff00' : '#333333';
                        ctx.fillRect(
                            building.x + window.x,
                            canvas.height - building.height + window.y,
                            window.size,
                            window.size
                        );
                    });
                });
                
                // Draw pipes
                ctx.fillStyle = '#05d9e8';
                pipes.forEach(pipe => {
                    // Pipe gradient
                    const pipeGradient = ctx.createLinearGradient(pipe.x, pipe.y, pipe.x + pipe.width, pipe.y);
                    pipeGradient.addColorStop(0, '#05d9e8');
                    pipeGradient.addColorStop(1, '#005678');
                    
                    ctx.fillStyle = pipeGradient;
                    ctx.fillRect(pipe.x, pipe.y, pipe.width, pipe.height);
                    
                    // Pipe borders
                    ctx.strokeStyle = '#ff2a6d';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(pipe.x, pipe.y, pipe.width, pipe.height);
                });
                
                // Draw bird
                ctx.fillStyle = bird.color;
                ctx.fillRect(bird.x, bird.y, bird.width, bird.height);
                
                // Draw bird eye
                ctx.fillStyle = 'white';
                ctx.fillRect(bird.x + 10, bird.y + 10, 8, 8);
                ctx.fillStyle = 'black';
                ctx.fillRect(bird.x + 14, bird.y + 12, 4, 4);
                
                // Draw bird beak
                ctx.fillStyle = '#ffff00';
                ctx.beginPath();
                ctx.moveTo(bird.x + bird.width, bird.y + 15);
                ctx.lineTo(bird.x + bird.width + 10, bird.y + 20);
                ctx.lineTo(bird.x + bird.width, bird.y + 25);
                ctx.fill();
            }
            
            // Main game loop
            function gameLoop() {
                if (gameRunning) {
                    update();
                    draw();
                    requestAnimationFrame(gameLoop);
                }
            }
            
            // Initial draw
            draw();
        });
    </script>
</html>
